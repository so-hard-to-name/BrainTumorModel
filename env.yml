name: ds_env
channels:
  - conda-forge
  - defaults
dependencies:
  # Core
  - python=3.10
  - pip
  - jupyterlab
  - ipykernel
  - notebook  # classic interface

  # Data Analysis
  - numpy
  - pandas
  - scipy
  - polars

  # Visualization
  - matplotlib
  - seaborn
  - plotly
  - altair

  # Machine Learning
  - scikit-learn
  - tensorflow
  - pytorch
  - torchvision
  - torchaudio
  - tensorflow-metal

  # Computer Vision
  - scikit-image
  - opencv

  # NLP / Transformers
  - transformers
  - datasets
  - accelerate

  # Utilities
  - tqdm
  - requests
  - openpyxl
  - ipywidgets

  # Torch info
  - torchinfo

  # Optional: pip-only packages
  - pip:
      - jupyterlab_code_formatter
      - nbconvert
      - voila
      - opencv-python  # in case pip version is needed
